name: Automated Multi-OS Release Compiler

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: TransferX_Windows.exe
            output_binary: dist/TransferX.exe
          - os: macos-latest
            asset_name: TransferX_Mac.zip
            output_binary: dist/TransferX
          - os: ubuntu-latest
            asset_name: TransferX_Linux.zip
            output_binary: dist/TransferX

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install PyInstaller and Application Modules
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller .

    - name: Setup UPX Compressor (Windows/Linux)
      if: matrix.os != 'macos-latest'
      uses: crazy-max/ghaction-upx@v3
      with:
        install-only: true

    - name: Execute Optimized PyInstaller Engine Build
          shell: bash
          run: |
            python -OO -m PyInstaller --onefile --console --name TransferX \
              --exclude-module tkinter \
              --exclude-module unittest \
              --exclude-module pydoc \
              --exclude-module lib2to3 \
              main.py

    - name: Package and Compress Binaries
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv ${{ matrix.output_binary }} dist/${{ matrix.asset_name }}
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          mv ${{ matrix.output_binary }} dist/TransferX_Mac
          chmod +x dist/TransferX_Mac
          cd dist && zip -r TransferX_Mac.zip TransferX_Mac
        else
          mv ${{ matrix.output_binary }} dist/TransferX_Linux
          chmod +x dist/TransferX_Linux
          cd dist && zip -r TransferX_Linux.zip TransferX_Linux
        fi

    - name: Upload Binary to GitHub Release Page
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.asset_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}