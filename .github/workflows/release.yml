name: Automated Multi-OS Release Compiler

on:
  push:
    tags:
      - 'v*' # Triggers automatically when you push a version tag like v1.0.0

permissions:
  contents: write # Allows the workflow to create a GitHub Release and upload binaries

jobs:
  build:
    name: Compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: TransferX_Windows.exe
            output_binary: dist/TransferX.exe
          - os: macos-latest
            artifact_name: TransferX_Mac
            output_binary: dist/TransferX
          - os: ubuntu-latest
            artifact_name: TransferX_Linux
            output_binary: dist/TransferX

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install PyInstaller and Application Modules
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller .

    - name: Execute PyInstaller Engine Build
      run: pyinstaller --onefile --console --name TransferX main.py

    - name: Prepare Binary Artifact with OS Name
      shell: bash
      run: |
        mv ${{ matrix.output_binary }} dist/${{ matrix.artifact_name }}

    - name: Upload Binary to GitHub Release Page
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.artifact_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}